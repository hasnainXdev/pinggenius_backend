[project]
name = "email-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apify-client==1.7.0",
    "apscheduler>=3.11.0",
    "black==23.10.1",
    "fastapi==0.104.1",
    "flake8==6.0.0",
    "google-api-python-client>=2.174.0",
    "google-auth>=2.40.3",
    "google-auth-oauthlib>=1.2.2",
    "google-search-results>=2.4.2",
    "httpx==0.25.2",
    "motor>=3.7.1",
    "mypy==1.7.1",
    "openai-agents==0.0.5",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.12.0",
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "python-dotenv==1.0.0",
    "python-multipart>=0.0.21",
    "pytz>=2025.2",
    "resend>=2.17.0",
    "serpapi>=0.1.5",
    "tenacity==8.2.3",
    "uvicorn[standard]==0.24.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # whitespace before ':'
    "W503",  # line break before binary operator
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
